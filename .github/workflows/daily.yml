# Optional: re-scrape every day and publish the updated page.
# Needs repository secret LLM_API_KEY and variable LLM_PROVIDER (Settings -> Secrets and variables -> Actions).
# A failed run makes GitHub email the repo owner, which is the failure alert.
name: Daily scrape

on:
  schedule:
    - cron: "17 5 * * *"   # 05:17 UTC daily (odd minute avoids the top-of-hour rush)
  workflow_dispatch: {}    # "Run workflow" button for a manual run

permissions:
  contents: write

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - name: Scrape and build page
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python scrape.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/bonuses.json docs/
          git diff --cached --quiet || git commit -m "Daily scrape $(date -u +%F)"
          git push
